<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manuel L. Quezon | 3D Interactive Tribute</title>
    <style>
      :root {
        --bg: #09131b;
        --bg-2: #102234;
        --panel: rgba(14, 26, 35, 0.82);
        --panel-strong: rgba(17, 32, 44, 0.95);
        --line: rgba(203, 170, 95, 0.38);
        --gold: #d4af37;
        --gold-soft: #f3d76d;
        --ivory: #efe4d0;
        --ink: #eaf3ff;
        --muted: #b7c7d9;
        --royal: #2d5b8f;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background:
          radial-gradient(circle at top, rgba(45, 91, 143, 0.35), transparent 40%),
          linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
        color: var(--ink);
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 24px;
      }

      .page-shell {
        width: min(1300px, 100%);
        min-height: 90vh;
        border: 1px solid var(--line);
        background: rgba(9, 19, 27, 0.9);
        border-radius: 26px;
        overflow: hidden;
        box-shadow: 0 25px 70px rgba(0, 0, 0, 0.45);
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 18px 28px;
        border-bottom: 1px solid rgba(255,255,255,0.08);
        background: rgba(8, 15, 21, 0.55);
        backdrop-filter: blur(10px);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--gold-soft);
      }

      .brand-mark {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 1.1rem;
        background: linear-gradient(135deg, var(--gold), #7a5d12);
        color: #1f1a0a;
        box-shadow: 0 0 20px rgba(212, 175, 55, 0.35);
      }

      .nav-link {
        color: var(--muted);
        text-decoration: none;
        font-size: 0.92rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .nav-link:hover { color: var(--gold-soft); }

      .layout {
        display: block;
        min-height: calc(90vh - 82px);
      }

      .info-panel {
        display: none;
      }

      .eyebrow {
        color: var(--gold-soft);
        letter-spacing: 0.14em;
        font-size: 0.74rem;
        text-transform: uppercase;
        margin-bottom: 16px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2.2rem, 3vw, 3.2rem);
        line-height: 1.05;
      }

      .subtitle {
        margin: 0 0 20px;
        color: var(--muted);
        line-height: 1.6;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin: 24px 0;
      }

      .stat {
        padding: 14px 12px;
        border: 1px solid rgba(212,175,55,0.2);
        border-radius: 16px;
        background: rgba(255,255,255,0.015);
      }

      .stat-label {
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .stat-value {
        display: block;
        margin-top: 8px;
        font-size: 1.05rem;
        color: var(--ink);
        font-weight: 700;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 28px;
      }

      button {
        appearance: none;
        border: 1px solid rgba(212,175,55,0.45);
        background: rgba(212, 175, 55, 0.1);
        color: var(--gold-soft);
        padding: 11px 16px;
        border-radius: 999px;
        cursor: pointer;
        font-weight: 600;
        letter-spacing: 0.04em;
        transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      }

      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 20px rgba(212,175,55,0.18);
        background: rgba(212, 175, 55, 0.18);
      }

      .viewer-panel {
        position: relative;
        background: radial-gradient(circle at 50% 30%, rgba(42, 80, 116, 0.25), transparent 35%), rgba(6, 12, 17, 0.72);
        min-height: 600px;
      }

      #sceneContainer {
        width: 100%;
        height: 100%;
        min-height: 600px;
      }

      .info-bubble {
        position: absolute;
        left: 26px;
        bottom: 24px;
        max-width: min(300px, calc(100% - 32px));
        padding: 16px 18px 14px;
        border-radius: 18px;
        background: rgba(8, 18, 25, 0.88);
        border: 1px solid rgba(212,175,55,0.35);
        backdrop-filter: blur(8px);
        box-shadow: 0 14px 26px rgba(0, 0, 0, 0.28);
        color: var(--ink);
        z-index: 2;
        opacity: 0;
        transform: translateY(8px);
        pointer-events: none;
        transition: opacity 0.2s ease, transform 0.2s ease;
      }

      .info-bubble.visible {
        opacity: 1;
        transform: translateY(0);
      }

      .info-bubble h3 {
        margin: 0 0 8px;
        color: var(--gold-soft);
        font-size: 1rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .info-bubble p {
        margin: 0;
        color: var(--muted);
        line-height: 1.5;
        font-size: 0.92rem;
      }

      .status-badge {
        position: absolute;
        right: 22px;
        top: 20px;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(11, 21, 31, 0.75);
        border: 1px solid rgba(212,175,55,0.28);
        color: var(--gold-soft);
        text-transform: uppercase;
        letter-spacing: 0.12em;
        font-size: 0.68rem;
      }

      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .info-panel {
          border-right: none;
          border-bottom: 1px solid rgba(255,255,255,0.08);
        }
      }
    </style>
  </head>
  <body>
    <div class="page-shell">
      <nav class="topbar">
        <div class="brand">
          <div class="brand-mark">Q</div>
          <span>QuezonXplore</span>
        </div>
        <a class="nav-link" href="index.html">Back to Museum</a>
      </nav>

      <main class="layout">
        <section class="viewer-panel">
          <div class="status-badge">Interactive 3D</div>
          <div id="infoBubble" class="info-bubble" aria-live="polite">
            <h3>Manuel L. Quezon</h3>
            <p>
              The first president of the Commonwealth of the Philippines, known for leading the nation through a pivotal era of democratic transition and public service.
            </p>
          </div>
          <div id="sceneContainer" aria-label="3D model viewer"></div>
        </section>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script>
      const container = document.getElementById('sceneContainer');
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x07141d);
      scene.fog = new THREE.Fog(0x07141d, 8, 20);

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      container.appendChild(renderer.domElement);

      const camera = new THREE.PerspectiveCamera(35, container.clientWidth / container.clientHeight, 0.1, 100);
      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      const infoBubble = document.getElementById('infoBubble');
      const orbitState = {
        yaw: -0.7,
        pitch: 0.35,
        distance: 5.8,
        minDistance: 3.5,
        maxDistance: 10,
        target: new THREE.Vector3(0, 1.4, 0)
      };

      function updateCamera() {
        const x = orbitState.distance * Math.sin(orbitState.pitch) * Math.sin(orbitState.yaw);
        const y = orbitState.distance * Math.cos(orbitState.pitch);
        const z = orbitState.distance * Math.sin(orbitState.pitch) * Math.cos(orbitState.yaw);
        camera.position.set(x, y + 1.4, z);
        camera.lookAt(orbitState.target);
      }

      updateCamera();

      let pointerDown = false;
      let lastPointerX = 0;
      let lastPointerY = 0;
      let dragStart = null;

      function showInfoBubble() {
        infoBubble.classList.add('visible');
      }

      function hideInfoBubble() {
        infoBubble.classList.remove('visible');
      }

      function handleCloudClick(event) {
        const rect = renderer.domElement.getBoundingClientRect();
        pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

        raycaster.setFromCamera(pointer, camera);
        const hits = raycaster.intersectObjects(cloudGroup.children, true);

        if (hits.length > 0) {
          showInfoBubble();
        } else {
          hideInfoBubble();
        }
      }

      renderer.domElement.addEventListener('pointerdown', (event) => {
        pointerDown = true;
        dragStart = { x: event.clientX, y: event.clientY };
        lastPointerX = event.clientX;
        lastPointerY = event.clientY;
      });

      window.addEventListener('pointermove', (event) => {
        if (!pointerDown) return;
        const deltaX = event.clientX - lastPointerX;
        const deltaY = event.clientY - lastPointerY;
        lastPointerX = event.clientX;
        lastPointerY = event.clientY;

        orbitState.yaw -= deltaX * 0.008;
        orbitState.pitch = THREE.MathUtils.clamp(orbitState.pitch - deltaY * 0.006, 0.2, 1.3);
        updateCamera();
      });

      window.addEventListener('pointerup', (event) => {
        pointerDown = false;

        if (dragStart && Math.abs(event.clientX - dragStart.x) < 8 && Math.abs(event.clientY - dragStart.y) < 8) {
          handleCloudClick(event);
        }

        dragStart = null;
      });
      window.addEventListener('pointerleave', () => { pointerDown = false; dragStart = null; });

      renderer.domElement.addEventListener('wheel', (event) => {
        event.preventDefault();
        orbitState.distance = THREE.MathUtils.clamp(
          orbitState.distance + event.deltaY * 0.005,
          orbitState.minDistance,
          orbitState.maxDistance
        );
        updateCamera();
      }, { passive: false });

      const hemi = new THREE.HemisphereLight(0xdfefff, 0x17232d, 1.5);
      scene.add(hemi);

      const key = new THREE.DirectionalLight(0xfff1c8, 1.7);
      key.position.set(3, 5, 4);
      scene.add(key);

      const rim = new THREE.DirectionalLight(0x75a8ff, 0.8);
      rim.position.set(-3, 2, -4);
      scene.add(rim);

      const floor = new THREE.Mesh(
        new THREE.CylinderGeometry(3.8, 4.2, 0.8, 64),
        new THREE.MeshStandardMaterial({
          color: 0x152c3c,
          metalness: 0.35,
          roughness: 0.7
        })
      );
      floor.position.y = -1.75;
      scene.add(floor);

      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(2.8, 0.06, 16, 100),
        new THREE.MeshStandardMaterial({
          color: 0xd4af37,
          emissive: 0x3a2a0d,
          metalness: 0.9,
          roughness: 0.25
        })
      );
      ring.rotation.x = Math.PI / 2;
      ring.position.y = -1.3;
      scene.add(ring);

      const statue = new THREE.Group();
      scene.add(statue);

      const base = new THREE.Mesh(
        new THREE.CylinderGeometry(1.15, 1.35, 0.6, 48),
        new THREE.MeshStandardMaterial({
          color: 0xc8b573,
          metalness: 0.7,
          roughness: 0.35
        })
      );
      base.position.y = -1.15;
      statue.add(base);

      const body = new THREE.Group();
      statue.add(body);

      const coatMaterial = new THREE.MeshStandardMaterial({
        color: 0x1a3957,
        metalness: 0.3,
        roughness: 0.7
      });

      const shirtMaterial = new THREE.MeshStandardMaterial({
        color: 0xf4ebdd,
        metalness: 0.08,
        roughness: 0.9
      });

      const skinMaterial = new THREE.MeshStandardMaterial({
        color: 0xecc8a3,
        roughness: 0.85
      });

      const darkMaterial = new THREE.MeshStandardMaterial({
        color: 0x1e2126,
        metalness: 0.45,
        roughness: 0.6
      });

      const goldMaterial = new THREE.MeshStandardMaterial({
        color: 0xd4af37,
        emissive: 0x2e2308,
        metalness: 0.9,
        roughness: 0.25
      });

      const shoulders = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.45, 0.8), coatMaterial);
      shoulders.position.y = 0.25;
      body.add(shoulders);

      const torso = new THREE.Mesh(new THREE.BoxGeometry(1.38, 1.9, 0.7), coatMaterial);
      torso.position.y = -0.72;
      body.add(torso);

      const shirt = new THREE.Mesh(new THREE.BoxGeometry(0.78, 1.25, 0.25), shirtMaterial);
      shirt.position.set(0, -0.7, 0.35);
      body.add(shirt);

      const belt = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.25, 0.9), goldMaterial);
      belt.position.set(0, -1.58, 0);
      body.add(belt);

      const leftArm = new THREE.Mesh(new THREE.CapsuleGeometry(0.18, 1.35, 6, 12), coatMaterial);
      leftArm.position.set(-1.1, -0.2, 0);
      leftArm.rotation.z = 0.25;
      body.add(leftArm);

      const rightArm = leftArm.clone();
      rightArm.position.x = 1.1;
      rightArm.rotation.z = -0.25;
      body.add(rightArm);

      const leftForearm = new THREE.Mesh(new THREE.CapsuleGeometry(0.14, 0.95, 6, 12), coatMaterial);
      leftForearm.position.set(-1.52, -1.1, 0.4);
      leftForearm.rotation.z = 0.5;
      body.add(leftForearm);

      const rightForearm = leftForearm.clone();
      rightForearm.position.x = 1.52;
      rightForearm.rotation.z = -0.5;
      body.add(rightForearm);

      const leftHand = new THREE.Mesh(new THREE.SphereGeometry(0.18, 20, 20), skinMaterial);
      leftHand.position.set(-1.83, -1.62, 0.48);
      body.add(leftHand);

      const rightHand = leftHand.clone();
      rightHand.position.x = 1.83;
      body.add(rightHand);

      const leftLeg = new THREE.Mesh(new THREE.CapsuleGeometry(0.22, 1.4, 6, 12), darkMaterial);
      leftLeg.position.set(-0.38, -2.75, 0);
      body.add(leftLeg);

      const rightLeg = leftLeg.clone();
      rightLeg.position.x = 0.38;
      body.add(rightLeg);

      const leftSock = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.7, 0.5), shirtMaterial);
      leftSock.position.set(-0.38, -3.9, 0.08);
      body.add(leftSock);

      const rightSock = leftSock.clone();
      rightSock.position.x = 0.38;
      body.add(rightSock);

      const leftShoe = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.22, 0.92), darkMaterial);
      leftShoe.position.set(-0.38, -4.35, 0.26);
      body.add(leftShoe);

      const rightShoe = leftShoe.clone();
      rightShoe.position.x = 0.38;
      body.add(rightShoe);

      const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.2, 0.28, 18), skinMaterial);
      neck.position.y = 0.88;
      body.add(neck);

      const head = new THREE.Mesh(new THREE.SphereGeometry(0.62, 32, 32), skinMaterial);
      head.position.y = 1.8;
      body.add(head);

      const hair = new THREE.Mesh(new THREE.SphereGeometry(0.64, 28, 24, 0, Math.PI * 2, 0, Math.PI * 0.7), darkMaterial);
      hair.scale.y = 0.78;
      hair.position.set(0, 1.95, -0.05);
      body.add(hair);

      const hairFront = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.25, 0.12), darkMaterial);
      hairFront.position.set(0, 2.02, 0.48);
      body.add(hairFront);

      const eyeGeometry = new THREE.SphereGeometry(0.08, 10, 10);
      const leftEye = new THREE.Mesh(eyeGeometry, darkMaterial);
      leftEye.position.set(-0.18, 1.83, 0.52);
      body.add(leftEye);

      const rightEye = leftEye.clone();
      rightEye.position.x = 0.18;
      body.add(rightEye);

      const nose = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.25, 12), skinMaterial);
      nose.position.set(0, 1.66, 0.58);
      nose.rotation.x = Math.PI / 2;
      body.add(nose);

      const mustache = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.12, 0.12), darkMaterial);
      mustache.position.set(0, 1.46, 0.56);
      mustache.rotation.z = 0.08;
      body.add(mustache);

      const mustacheLeft = mustache.clone();
      mustacheLeft.position.x = -0.17;
      mustacheLeft.rotation.z = 0.35;
      body.add(mustacheLeft);

      const mustacheRight = mustache.clone();
      mustacheRight.position.x = 0.17;
      mustacheRight.rotation.z = -0.35;
      body.add(mustacheRight);

      const glassesFrame = new THREE.Mesh(new THREE.TorusGeometry(0.16, 0.02, 10, 22, Math.PI), darkMaterial);
      glassesFrame.rotation.y = Math.PI / 2;
      glassesFrame.position.set(0, 1.82, 0.5);
      body.add(glassesFrame);

      const leftLens = new THREE.Mesh(new THREE.SphereGeometry(0.11, 14, 14), new THREE.MeshStandardMaterial({ color: 0x2f4d6d, transparent: true, opacity: 0.6, metalness: 0.2, roughness: 0.1 }));
      leftLens.position.set(-0.18, 1.82, 0.52);
      body.add(leftLens);

      const rightLens = leftLens.clone();
      rightLens.position.x = 0.18;
      body.add(rightLens);

      const medal = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.06, 32), goldMaterial);
      medal.position.set(0, -1.1, 0.42);
      body.add(medal);

      const medalCenter = new THREE.Mesh(new THREE.SphereGeometry(0.08, 18, 18), new THREE.MeshStandardMaterial({ color: 0x8d6d1a, metalness: 0.7, roughness: 0.35 }));
      medalCenter.position.set(0, -1.09, 0.48);
      body.add(medalCenter);

      const cloudGroup = new THREE.Group();
      cloudGroup.position.set(0, 3.7, 0.2);
      const cloudMaterial = new THREE.MeshStandardMaterial({
        color: 0xf3f7ff,
        transparent: true,
        opacity: 0.9,
        roughness: 0.9,
        metalness: 0.08
      });

      const cloudMain = new THREE.Mesh(new THREE.SphereGeometry(0.9, 24, 24), cloudMaterial);
      cloudMain.scale.set(1.5, 0.8, 1.2);
      cloudGroup.add(cloudMain);

      const cloudPuff1 = new THREE.Mesh(new THREE.SphereGeometry(0.55, 20, 20), cloudMaterial);
      cloudPuff1.position.set(-0.9, 0.15, 0.2);
      cloudGroup.add(cloudPuff1);

      const cloudPuff2 = new THREE.Mesh(new THREE.SphereGeometry(0.58, 20, 20), cloudMaterial);
      cloudPuff2.position.set(0.85, 0.22, 0.15);
      cloudGroup.add(cloudPuff2);

      const cloudPuff3 = new THREE.Mesh(new THREE.SphereGeometry(0.42, 18, 18), cloudMaterial);
      cloudPuff3.position.set(0, 0.42, 0.55);
      cloudGroup.add(cloudPuff3);

      cloudGroup.userData.info = 'Quezon';
      scene.add(cloudGroup);

      const plaque = new THREE.Mesh(
        new THREE.BoxGeometry(1.5, 0.5, 0.12),
        new THREE.MeshStandardMaterial({ color: 0x224a71, metalness: 0.35, roughness: 0.4 })
      );
      plaque.position.set(0, 2.8, -0.2);
      plaque.rotation.x = 0.12;
      scene.add(plaque);

      const plaqueText = document.createElement('canvas');
      plaqueText.width = 512;
      plaqueText.height = 150;
      const textCtx = plaqueText.getContext('2d');
      textCtx.fillStyle = '#f3d76d';
      textCtx.font = '700 52px Segoe UI';
      textCtx.textAlign = 'center';
      textCtx.textBaseline = 'middle';
      textCtx.fillText('MANUEL L. QUEZON', 256, 75);
      const plaqueTexture = new THREE.CanvasTexture(plaqueText);
      const plaqueMaterial = new THREE.MeshStandardMaterial({ map: plaqueTexture, emissive: 0x11222f, emissiveIntensity: 0.4 });
      plaque.material = plaqueMaterial;

      statue.position.y = 0.7;
      statue.rotation.y = -0.55;

      let autoSpin = true;
      const resetViewBtn = document.getElementById('resetViewBtn');
      const toggleSpinBtn = document.getElementById('toggleSpinBtn');

      if (resetViewBtn) {
        resetViewBtn.addEventListener('click', () => {
          statue.rotation.y = -0.55;
          statue.rotation.x = 0;
          orbitState.yaw = -0.7;
          orbitState.pitch = 0.35;
          orbitState.distance = 5.8;
          updateCamera();
        });
      }

      if (toggleSpinBtn) {
        toggleSpinBtn.addEventListener('click', () => {
          autoSpin = !autoSpin;
          toggleSpinBtn.textContent = autoSpin ? 'Pause Spin' : 'Resume Spin';
        });
      }

      function resizeRenderer() {
        const width = container.clientWidth;
        const height = container.clientHeight;
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
        renderer.setSize(width, height);
      }

      window.addEventListener('resize', resizeRenderer);

      const clock = new THREE.Clock();
      function animate() {
        const elapsed = clock.getElapsedTime();

        if (autoSpin) {
          statue.rotation.y += 0.005;
        }

        statue.position.y = 0.7 + Math.sin(elapsed * 1.7) * 0.12;
        statue.rotation.x = Math.sin(elapsed * 1.2) * 0.08;

        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }

      resizeRenderer();
      animate();
    </script>
  </body>
</html>
